[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# Internal crates (dependencies point downward only; see docs/architecture.md section 4)
face-core = { path = "crates/face-core" }
face-imaging = { path = "crates/face-imaging" }
face-models = { path = "crates/face-models" }
face-quality = { path = "crates/face-quality" }
face-document = { path = "crates/face-document" }
face-verify = { path = "crates/face-verify" }

# Shared third-party versions. Add new ones here, not per crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
thiserror = "2"
tracing = "0.1"
# Pure-Rust, memory-safe decoders only (zune-jpeg, png, image-webp). Do not enable formats
# backed by C libraries.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Service platform (face-server). Licences: see the service platform agent's report.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "multipart", "matched-path"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
sha2 = "0.11"
subtle = "2.6"
uuid = { version = "1.26", features = ["v4"] }
base64 = "0.23"
prometheus = { version = "0.14", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "registry", "ansi"] }
windows-service = "0.8"
# The HTTP/1 connection loop (header timeout, connection limit, TLS). Already in the tree through
# axum, with the same features: no new crates. MIT.
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "service", "http1"] }
# In-process TLS and mTLS: rustls with the ring provider (rustls Apache-2.0/ISC/MIT, ring
# Apache-2.0 AND ISC, rustls-webpki ISC, untrusted ISC). No OpenSSL, no aws-lc. PEM parsing via
# rustls-pki-types (MIT/Apache-2.0), not the unmaintained rustls-pemfile.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

# Vision (face-models, face-quality). Licences: see the vision agent's report.
# ort wraps the ONNX Runtime 1.28 C API; `load-dynamic` loads Microsoft's official onnxruntime
# library from a path at runtime (fetched by service/scripts/fetch-onnxruntime.*). No bundled or
# downloaded binaries (default features off). `api-28` makes ort request the 1.28 C API, so an
# older onnxruntime library (e.g. the one Windows ships in System32) is refused at load time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-28"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep unwinding: a panic while handling one request must not take the service down.
panic = "unwind"
